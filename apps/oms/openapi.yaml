openapi: 3.0.3
info:
  title: OMS - Order Management System
  version: 1.0.0
  description: |
    OpenAPI documentation for the OMS service in the EDLIE project.
    Includes order creation, retrieval, statistics, and health check endpoints.
servers:
  - url: http://localhost:8001
paths:
  /health:
    get:
      summary: Health check
      description: Returns the running status of the OMS service.
      responses:
        '200':
          description: Service is healthy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
              examples:
                healthy:
                  value:
                    status: AKTIF
                    layanan: OMS
  /pesanan:
    post:
      summary: Create a new order
      description: Creates a new order record in OMS, stores it in PostgreSQL, and publishes a canonical order event.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrderCreateRequest'
            examples:
              buatPesanan:
                value:
                  pelanggan:
                    nama: Jane Doe
                    email: jane.doe@email.com
                  daftarBarang:
                    - sku: SKU-NEON-01
                      qty: 2
                    - sku: SKU-NEON-02
                      qty: 1
                  totalHarga: 450000
      responses:
        '201':
          description: Order successfully created and published
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderCreateResponse'
              examples:
                berhasil:
                  value:
                    pesan: Pesanan berhasil dibuat dan event dipublikasikan
                    id_pesanan: PSN-20260602-A1B2C3
                    data:
                      id_pesanan: PSN-20260602-A1B2C3
                      pelanggan:
                        nama: Jane Doe
                        email: jane.doe@email.com
                      daftar_barang:
                        - sku: SKU-NEON-01
                          qty: 2
                        - sku: SKU-NEON-02
                          qty: 1
                      total_harga: 450000
                      waktu: '2026-06-11T12:45:00.000Z'
                      tipe_event: pesanan.dibuat
                      sumber: OMS
                      id_pesan: 123e4567-e89b-12d3-a456-426614174000
        '400':
          description: Invalid request body or missing required fields
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                invalidData:
                  value:
                    error: Data tidak lengkap: pelanggan (nama, email), daftarBarang, totalHarga wajib diisi
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                internalError:
                  value:
                    error: Kesalahan server internal
                    detail: Database connection failed
    get:
      summary: List all orders
      description: Retrieves all orders stored in OMS.
      responses:
        '200':
          description: List of stored orders
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderListResponse'
              examples:
                daftarPesanan:
                  value:
                    jumlah: 2
                    daftar_pesanan:
                      - id_pesanan: PSN-20260602-A1B2C3
                        nama_pelanggan: Jane Doe
                        email_pelanggan: jane.doe@email.com
                        daftar_barang:
                          - sku: SKU-NEON-01
                            qty: 2
                        total_harga: 450000
                        status: DIBUAT
                      - id_pesanan: PSN-20260603-B4C5D6
                        nama_pelanggan: Budi Santoso
                        email_pelanggan: budi.santoso@email.com
                        daftar_barang:
                          - sku: SKU-NEON-02
                            qty: 1
                        total_harga: 220000
                        status: DIBUAT
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                dbError:
                  value:
                    error: Kesalahan koneksi database
  /pesanan/{id}:
    get:
      summary: Get order by ID
      description: Retrieves detail of a single order by its order ID.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: Order identifier
      responses:
        '200':
          description: Order detail retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderDetailResponse'
              examples:
                orderDetail:
                  value:
                    id_pesanan: PSN-20260602-A1B2C3
                    nama_pelanggan: Jane Doe
                    email_pelanggan: jane.doe@email.com
                    daftar_barang:
                      - sku: SKU-NEON-01
                        qty: 2
                      - sku: SKU-NEON-02
                        qty: 1
                    total_harga: 450000
                    status: DIBUAT
                    dibuat_pada: '2026-06-11T12:45:00.000Z'
        '404':
          description: Order not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                notFound:
                  value:
                    error: Pesanan tidak ditemukan
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                serverError:
                  value:
                    error: Kesalahan server internal
                    detail: Unexpected database error
  /statistik:
    get:
      summary: Get OMS statistics
      description: Retrieves summary statistics for OMS orders.
      responses:
        '200':
          description: Statistics retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StatisticsResponse'
              examples:
                statistik:
                  value:
                    total_pesanan: 12
                    total_pendapatan: 2350000
                    pesanan_hari_ini: 3
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                statistikError:
                  value:
                    error: Kesalahan server internal
                    detail: Failed to query statistics
components:
  schemas:
    HealthResponse:
      type: object
      properties:
        status:
          type: string
          example: AKTIF
        layanan:
          type: string
          example: OMS
      required:
        - status
        - layanan
    OrderItem:
      type: object
      properties:
        sku:
          type: string
          example: SKU-NEON-01
        qty:
          type: integer
          example: 2
      required:
        - sku
        - qty
    CustomerInfo:
      type: object
      properties:
        nama:
          type: string
          example: Jane Doe
        email:
          type: string
          format: email
          example: jane.doe@email.com
      required:
        - nama
        - email
    OrderCreateRequest:
      type: object
      properties:
        pelanggan:
          $ref: '#/components/schemas/CustomerInfo'
        daftarBarang:
          type: array
          items:
            $ref: '#/components/schemas/OrderItem'
        totalHarga:
          type: integer
          example: 450000
      required:
        - pelanggan
        - daftarBarang
        - totalHarga
    OrderCreateResponse:
      type: object
      properties:
        pesan:
          type: string
          example: Pesanan berhasil dibuat dan event dipublikasikan
        id_pesanan:
          type: string
          example: PSN-20260602-A1B2C3
        data:
          type: object
          properties:
            id_pesanan:
              type: string
              example: PSN-20260602-A1B2C3
            pelanggan:
              $ref: '#/components/schemas/CustomerInfo'
            daftar_barang:
              type: array
              items:
                $ref: '#/components/schemas/OrderItem'
            total_harga:
              type: integer
              example: 450000
            waktu:
              type: string
              format: date-time
              example: '2026-06-11T12:45:00.000Z'
            tipe_event:
              type: string
              example: pesanan.dibuat
            sumber:
              type: string
              example: OMS
            id_pesan:
              type: string
              example: 123e4567-e89b-12d3-a456-426614174000
      required:
        - pesan
        - id_pesanan
        - data
    OrderListResponse:
      type: object
      properties:
        jumlah:
          type: integer
          example: 2
        daftar_pesanan:
          type: array
          items:
            $ref: '#/components/schemas/OrderSummary'
      required:
        - jumlah
        - daftar_pesanan
    OrderSummary:
      type: object
      properties:
        id_pesanan:
          type: string
          example: PSN-20260602-A1B2C3
        nama_pelanggan:
          type: string
          example: Jane Doe
        email_pelanggan:
          type: string
          format: email
          example: jane.doe@email.com
        daftar_barang:
          type: array
          items:
            $ref: '#/components/schemas/OrderItem'
        total_harga:
          type: integer
          example: 450000
        status:
          type: string
          example: DIBUAT
      required:
        - id_pesanan
        - nama_pelanggan
        - email_pelanggan
        - daftar_barang
        - total_harga
        - status
    OrderDetailResponse:
      type: object
      properties:
        id_pesanan:
          type: string
          example: PSN-20260602-A1B2C3
        nama_pelanggan:
          type: string
          example: Jane Doe
        email_pelanggan:
          type: string
          format: email
          example: jane.doe@email.com
        daftar_barang:
          type: array
          items:
            $ref: '#/components/schemas/OrderItem'
        total_harga:
          type: integer
          example: 450000
        status:
          type: string
          example: DIBUAT
        dibuat_pada:
          type: string
          format: date-time
          example: '2026-06-11T12:45:00.000Z'
      required:
        - id_pesanan
        - nama_pelanggan
        - email_pelanggan
        - daftar_barang
        - total_harga
        - status
    StatisticsResponse:
      type: object
      properties:
        total_pesanan:
          type: integer
          example: 12
        total_pendapatan:
          type: number
          format: float
          example: 2350000
        pesanan_hari_ini:
          type: integer
          example: 3
      required:
        - total_pesanan
        - total_pendapatan
        - pesanan_hari_ini
    ErrorResponse:
      type: object
      properties:
        error:
          type: string
      required:
        - error
