worker_processes 1;

events {
    worker_connections 1024;
}

http {
    limit_req_zone $binary_remote_addr zone=batas_api:10m rate=30r/m;

    upstream backend_oms {
        server oms-app:8001;
    }
    upstream backend_wms {
        server wms-app:8002;
    }
    upstream backend_sls {
        server sls-app:8003;
    }
    upstream backend_ctn {
        server ctn-app:8004;
    }

    server {
        listen 8080;
        server_name _;

        # CORS headers
        add_header 'Access-Control-Allow-Origin' '*' always;
        add_header 'Access-Control-Allow-Methods' 'GET, POST, PATCH, PUT, DELETE, OPTIONS' always;
        add_header 'Access-Control-Allow-Headers' 'Content-Type, Authorization, Cache-Control' always;

        # Hide backend CORS headers to avoid conflicts
        proxy_hide_header 'Access-Control-Allow-Origin';
        proxy_hide_header 'Access-Control-Allow-Methods';
        proxy_hide_header 'Access-Control-Allow-Headers';
        proxy_hide_header 'Access-Control-Allow-Credentials';

        # Handle OPTIONS preflight requests
        if ($request_method = 'OPTIONS') {
            return 204;
        }

        # Health gateway
        location = /health {
            return 200 '{"status":"AKTIF","layanan":"API-Gateway"}';
            add_header Content-Type application/json;
        }

        # Health per service
        location = /health/oms {
            proxy_pass http://backend_oms/health;
            proxy_set_header Host $host;
        }
        location = /health/wms {
            proxy_pass http://backend_wms/health;
            proxy_set_header Host $host;
        }
        location = /health/sls {
            proxy_pass http://backend_sls/health;
            proxy_set_header Host $host;
        }
        location = /health/ctn {
            proxy_pass http://backend_ctn/health;
            proxy_set_header Host $host;
        }

        # OMS statistik
        location = /api/statistik {
            proxy_pass http://backend_oms/statistik;
            proxy_set_header Host $host;
        }

        # OMS pesanan (GET list + POST buat pesanan)
        location /api/pesanan {
            limit_req zone=batas_api burst=10 nodelay;
            rewrite ^/api/pesanan(.*)$ /pesanan$1 break;
            proxy_pass http://backend_oms;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_read_timeout 30s;
        }

        # SLS statistik & server-time
        location /api/sls/ {
            limit_req zone=batas_api burst=10 nodelay;
            rewrite ^/api/sls/(.*)$ /api/v1/$1 break;
            proxy_pass http://backend_sls;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_read_timeout 30s;
        }

        # SLS pengiriman — GET list, PATCH status, PATCH eta
        location /api/pengiriman {
            limit_req zone=batas_api burst=10 nodelay;
            rewrite ^/api/pengiriman(.*)$ /api/v1/pengiriman$1 break;
            proxy_pass http://backend_sls;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_read_timeout 30s;
        }

        # WMS
        location /api/gudang {
            limit_req zone=batas_api burst=5 nodelay;
            rewrite ^/api/gudang(.*)$ /api/v1$1 break;
            proxy_pass http://backend_wms;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # CTN pelacakan
        location /api/pelacakan {
            limit_req zone=batas_api burst=20 nodelay;
            rewrite ^/api/pelacakan(.*)$ /api/v1/pelacakan$1 break;
            proxy_pass http://backend_ctn;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # CTN tracking (alias untuk /api/pelacakan — backward compat dengan README)
        location /api/tracking {
            limit_req zone=batas_api burst=20 nodelay;
            rewrite ^/api/tracking(.*)$ /api/v1/pelacakan$1 break;
            proxy_pass http://backend_ctn;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        location / {
            return 404 '{"error":"Rute tidak ditemukan"}';
            add_header Content-Type application/json;
        }
    }
}
